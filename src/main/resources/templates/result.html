<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{result.title}">Movie Result</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body style="font-family: Arial; background-color: #f4f4f4;">

<div style="width: 600px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px;">
    <div class="language-switch">
        <a th:href="@{/result(lang='en')}" th:text="#{app.language.english}">English</a>
        <span>|</span>
        <a th:href="@{/result(lang='ka')}" th:text="#{app.language.georgian}">Georgian</a>
    </div>

    <h2 th:text="#{result.success}">Movie Submitted Successfully</h2>

    <p>
        <b th:text="#{form.movieName}">Movie Name:</b>
        <span th:text="${movie != null ? movie.movieName : ''}">Movie Name</span>
    </p>
    <p>
        <b th:text="#{result.uploadedFile}">Uploaded File:</b>
        <span th:text="${fileName}">file.jpg</span>
    </p>

    <a th:href="@{/form}">
        <button style="padding:10px 20px; background-color:green; color:white; border:none; border-radius:5px;"
                th:text="#{result.addAnother}">
            Add Another Movie
        </button>
    </a>
</div>

</body>
</html>
